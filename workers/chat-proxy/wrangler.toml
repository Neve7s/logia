name = "logia-chat-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
# NVIDIA_API_KEY se configura como secret en Cloudflare Dashboard
# o con: wrangler secret put NVIDIA_API_KEY
#
# Para el formulario de contacto:
#   wrangler secret put RESEND_API
# Opcional (si no, se usan los valores por defecto):
# CONTACT_TO_EMAIL = "soporte@logia.lat"
# CONTACT_FROM_EMAIL = "LogIA Contacto <suscriptores@logia.lat>"
