    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es LogIA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LogIA es una plataforma integral para agencias de carga en Latinoamérica. Incluye facturación electrónica SUNAT, cotizaciones de fletes, tracking de envíos, consultador de importadores, reclutamiento ATS y más."
          }
        },
        {
          "@type": "Question",
          "name": "¿LogIA calcula automáticamente el IGV en facturación?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. LogIA detecta automáticamente si un servicio está sujeto a IGV o está exento. Los fletes marítimos y aéreos están exonerados del IGV en Perú."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué son las detracciones en facturación SUNAT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Las detracciones son retenciones de impuestos que SUNAT aplica a ciertos servicios. LogIA calcula automáticamente si un servicio tiene detracción y el porcentaje aplicable."
          }
        },
        {
          "@type": "Question",
          "name": "¿Para qué sirve el Consultador de Importadores?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Consultador es un data lake con datos de SUNAT de importadores peruanos. Muestra resúmenes de empresas, volumen de importación, frecuencia, países de origen y destino. Se actualiza cada 7 días."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es el ATS de LogIA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El ATS (Applicant Tracking System) es el sistema de reclutamiento de LogIA. Publica vacantes, recibe postulaciones y gestiona candidatos con un flujo visual Kanban."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los fletes marítimos pagan IGV en Perú?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Los fletes marítimos y aéreos de transporte internacional están exonerados del IGV en Perú según la SUNAT."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta LogIA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LogIA tiene planes desde $119.99/mes (Básico, 6 usuarios) hasta $199.99/mes (Premium, 15 usuarios). Ofrecemos prueba gratuita de 2 semanas sin tarjeta de crédito."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo solicitar mejoras o funcionalidades nuevas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. LogIA está en constante evolución. Si tu agencia necesita algo que no está, nos lo dices, lo analizamos y si es viable, lo implementamos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Ofrecen capacitaciones?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Ofrecemos capacitaciones virtuales personalizadas y acuerdos presenciales según ubicación. También tenemos videos guía de cada módulo dentro de la plataforma."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es la Calculadora de Impuestos de Importación?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Es una herramienta gratuita que calcula aranceles, impuestos y costos totales de importación. Ideal para importadores que quieren saber cuánto van a pagar antes de importar."
          }
        }
      ]
    }
    </script>
